version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: society360-postgres
    restart: always
    environment:
      POSTGRES_DB: society360_db
      POSTGRES_USER: society360_user
      POSTGRES_PASSWORD: society360_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations/V1__init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U society360_user -d society360_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: society360-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/society360_db
      DB_USERNAME: society360_user
      DB_PASSWORD: society360_password
      SOCIETY360_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: society360-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
