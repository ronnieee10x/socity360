server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: society360-backend
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

society360:
  jwt:
    secret: ${JWT_SECRET:${SOCIETY360_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000} # 1 hour
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
  superadmin:
    email: ${SUPERADMIN_EMAIL:superadmin@society360.com}
    password: ${SUPERADMIN_PASSWORD:Admin@12345}
    name: ${SUPERADMIN_NAME:Platform Super Administrator}
    phone: ${SUPERADMIN_PHONE:+1-800-555-0199}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

---
# Development Profile (H2 with PostgreSQL compatibility mode)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:society360;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Production Profile (PostgreSQL 16)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/society360_db}}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:society360_user}
    password: ${DB_PASSWORD:society360_password}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
